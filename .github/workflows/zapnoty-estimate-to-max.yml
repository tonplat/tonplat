# ============================================================================
# ТонПлат: смета-файл в MAX (ред. 20.11.2026, версия 3)
# ----------------------------------------------------------------------------
# Сайт шлёт компактную заявку: сводка + ссылка smeta.html#<base64url> со всеми
# позициями корзины. Workflow раз в 5 минут забирает новые заявки, распаковывает
# ссылку, подтягивает имена/цены из menu-data.js боевого сайта, собирает DOCX
# (python-docx), загружает в приватное хранилище Zapnoty (POST /v1/agent/media)
# и шлёт подписчикам в MAX сообщение С ФАЙЛОM (POST /v1/send, media document).
# Если ссылки в сообщении нет — fallback: таблица восстанавливается из строк
# сообщения старого формата.
#
# Установка: README.md, раздел «Смета файлом в MAX». Секреты:
#   ZN_API_KEY (zn_live_…), ZN_SUBSCRIBER_MAX (sub_…), опц. ZN_SUBSCRIBER_MAX2,
#   опц. ZN_AGENT_KEY (agtk_…), если загрузку медиа не примет ключ проекта.
# ============================================================================
name: zapnoty-estimate-to-max

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: cursor.json
          key: zapnoty-cursor-${{ github.run_id }}
          restore-keys: |
            zapnoty-cursor-

      - name: Install python-docx
        run: pip install --quiet python-docx

      - name: Build DOCX estimates and deliver to MAX
        env:
          ZN_KEY: ${{ secrets.ZN_API_KEY }}
          ZN_AGENT_KEY: ${{ secrets.ZN_AGENT_KEY }}
          SUB_ID: ${{ secrets.ZN_SUBSCRIBER_MAX }}
          SUB_ID2: ${{ secrets.ZN_SUBSCRIBER_MAX2 }}
          FORM_ID: e07d9ea7-c654-4bff-a398-1a8b4dbbd119
        run: |
          python3 - <<'PY'
          import os, re, json, base64, pathlib, uuid, subprocess
          import urllib.request, urllib.error
          from docx import Document
          from docx.shared import Pt

          ZN = os.environ["ZN_KEY"]
          AGT = os.environ.get("ZN_AGENT_KEY") or ZN
          SUB = os.environ["SUB_ID"]
          FORM = os.environ["FORM_ID"]
          API = "https://api.zapnoty.com"
          MENU_URL = "https://xn--80avfdgpf.xn--p1ai/menu-data.js"
          DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

          LEGAL_FULL = "Общество с ограниченной ответственностью «Тон Плат»"
          INN, KPP, OGRN = "6314049248", "631401001", "1226300038326"
          ADDRESS = "г. Самара, ул. Комсомольская, 29"
          PHONE = "+7 (927) 605-84-88"
          SITE = "https://тонплат.рф/"
          DIRECTOR = "Вардалахос Ольга Геннадьевна"

          if not SUB:
              raise SystemExit("Нет ZN_SUBSCRIBER_MAX: добавьте subscriber_id (sub_…) в секреты.")
          TARGETS = [s for s in (SUB, (os.environ.get("SUB_ID2") or "").strip()) if s]

          cur = pathlib.Path("cursor.json")
          state = json.loads(cur.read_text()) if cur.exists() else {"seen": []}
          seen = set(state["seen"])

          def req(method, path, key, data=None, extra_headers=None):
              headers = {"Authorization": "Bearer " + key}
              if extra_headers:
                  headers.update(extra_headers)
              body = None
              if data is not None:
                  body = data if isinstance(data, bytes) else json.dumps(data).encode()
                  if not extra_headers or "Content-Type" not in extra_headers:
                      headers["Content-Type"] = "application/json"
              r = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=90) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def send_with_approval(body):
              st, raw = req("POST", "/v1/send", ZN, body)
              if st == 202:
                  rid = None
                  try:
                      rid = json.loads(raw).get("request_id")
                  except Exception:
                      rid = None
                  if rid:
                      for _ in range(4):
                          stp, rawp = req("GET", f"/v1/agent/requests/{rid}?wait=25", ZN)
                          pj = json.loads(rawp) if rawp else {}
                          if pj.get("reason_code") in ("approved_full", "approved_once") or pj.get("status") == "approved":
                              return req("POST", "/v1/send", ZN, body)
                      return 202, raw
              return st, raw

          _menu = {}
          def price_map():
              if "m" in _menu:
                  return _menu["m"]
              with urllib.request.urlopen(MENU_URL, timeout=60) as r:
                  js = r.read().decode("utf-8")
              pathlib.Path("menu-data.js").write_text(js)
              out = subprocess.run(
                  ["node", "-e",
                   "const fs=require('fs');global.window=global;"
                   "eval(fs.readFileSync('menu-data.js','utf8'));"
                   "console.log(JSON.stringify(window.TONPLAT_DATA.items.map(i=>[i.id,i.name,i.price])))"],
                  capture_output=True, text=True, timeout=60)
              m = {int(a): (b, c) for a, b, c in json.loads(out.stdout)}
              _menu["m"] = m
              return m

          def assemble_docx(num, date_ru, customer, occasion, rows, total_line, notes, out_path):
              doc = Document()
              p0 = doc.add_paragraph()
              r0 = p0.add_run(f"СМЕТА {num}")
              r0.bold = True
              r0.font.size = Pt(15)
              p0.alignment = 1
              p1 = doc.add_paragraph(f"от {date_ru} · г. Самара")
              p1.alignment = 1
              doc.add_paragraph(f"Исполнитель: {LEGAL_FULL}; ИНН {INN}, КПП {KPP}, ОГРН {OGRN}; УСН 6%.")
              doc.add_paragraph(f"Адрес: {ADDRESS}; тел. {PHONE}; сайт {SITE}")
              if customer:
                  doc.add_paragraph(f"Заказчик: {customer}")
              if occasion:
                  doc.add_paragraph(f"Повод: {occasion}")
              table = doc.add_table(rows=1, cols=4)
              table.style = "Table Grid"
              for c, t in zip(table.rows[0].cells, ("Наименование", "Кол-во", "Цена", "Сумма")):
                  c.text = t
                  for par in c.paragraphs:
                      for r in par.runs:
                          r.bold = True
              for row in rows:
                  cells = table.add_row().cells
                  for c, t in zip(cells, row):
                      c.text = t
              doc.add_paragraph("")
              tp = doc.add_paragraph(f"Итого: {total_line}" if total_line else "Итого: см. таблицу")
              for r in tp.runs:
                  r.bold = True
              if notes:
                  doc.add_paragraph(f"Примечания заказчика: {notes}")
              doc.add_paragraph("НДС не облагается (УСН). Оплата после получения; без минимальной суммы заказа.")
              doc.add_paragraph(f"Смета сформирована автоматически на сайте {SITE} {date_ru}.")
              doc.add_paragraph(f"Подпись исполнителя: ______ / {DIRECTOR} /")
              doc.save(out_path)
              return True

          LINK_RE = re.compile(r"smeta\.html#([A-Za-z0-9_\-]+)")
          def parse_link(message):
              m = LINK_RE.search(message or "")
              if not m:
                  return None
              b64 = m.group(1).replace("-", "+").replace("_", "/")
              b64 += "=" * (-len(b64) % 4)
              try:
                  pl = json.loads(base64.b64decode(b64).decode("utf-8"))
              except Exception:
                  return None
              pm = price_map()
              rows, tot_p, tot_s = [], 0, 0
              for r in pl.get("i", []):
                  iid = int(r[0]); qty = int(r[1]); note = r[2] if len(r) > 2 else ""
                  name, price = pm.get(iid, (f"Позиция {iid}", 0))
                  rows.append((name + (f" ({note})" if note else ""), f"{qty} шт.", f"{price} ₽", f"{price * qty} ₽"))
                  tot_p += qty; tot_s += price * qty
              if not rows:
                  return None
              cust = pl.get("c") or "—"
              if pl.get("p"):
                  cust += f", тел. {pl['p']}"
              if pl.get("tg"):
                  cust += f", Telegram: {pl['tg']}"
              occ = pl.get("o") or ""
              if pl.get("g"):
                  occ += f"; гостей: {pl['g']} чел."
              return dict(num=pl.get("n", ""), date_ru=pl.get("d", ""), customer=cust, occasion=occ.strip(),
                            rows=rows, total_line=f"{len(rows)} поз., {tot_p} шт. на сумму {tot_s} ₽",
                            notes=pl.get("x") or "")

          META_RE = re.compile(r"^СМЕТА\s+(\S+)\s+от\s+([\d.]+)")
          CUSTOMER_RE = re.compile(r"^Заказчик:\s+(.*)$")
          OCCASION_RE = re.compile(r"^Повод:\s+(.*)$")
          TOTAL_RE = re.compile(r"^ИТОГО:\s+(.*)$")
          ROW_RE = re.compile(r"^(\d+)\.\s+(.+?)\s+—\s+(\d+)\s+шт\.\s+×\s+([\d\s]+)₽?\s*=\s*([\d\s]+)₽?$")
          def parse_message(message):
              num = date_ru = customer = occasion = total_line = ""
              rows = []
              for line in (message or "").splitlines():
                  line = line.strip()
                  m = META_RE.match(line)
                  if m:
                      num, date_ru = m.group(1), m.group(2); continue
                  m = CUSTOMER_RE.match(line)
                  if m:
                      customer = m.group(1); continue
                  m = OCCASION_RE.match(line)
                  if m:
                      occasion = m.group(1); continue
                  m = TOTAL_RE.match(line)
                  if m:
                      total_line = m.group(1); continue
                  m = ROW_RE.match(line)
                  if m:
                      rows.append((m.group(2), m.group(3) + " шт.", m.group(4).strip() + " ₽", m.group(5).strip() + " ₽"))
              if not rows:
                  return None
              return dict(num=num, date_ru=date_ru, customer=customer, occasion=occasion,
                            rows=rows, total_line=total_line, notes="")

          st, raw = req("GET", f"/v1/forms/{FORM}/submissions?limit=25", ZN)
          if st != 200:
              raise SystemExit(f"Не удалось получить заявки: {st} {raw[:300]!r}")
          payload = json.loads(raw)
          items = payload.get("submissions") or payload.get("items") or payload.get("data") or []
          if isinstance(items, dict):
              items = items.get("items") or []

          fresh = [it for it in items if it.get("id") and str(it["id"]) not in seen]
          fresh.reverse()

          for it in fresh:
              sid = str(it["id"])
              fields = it.get("data") or it.get("fields") or it
              msg = fields.get("message") or ""
              parts = parse_link(msg) or parse_message(msg)
              if not parts:
                  print(f"{sid}: нет ни ссылки, ни табличной сметы — файл не формируем")
                  seen.add(sid)
                  continue
              tmp = pathlib.Path(f"smeta-{sid[:8]}.docx")
              assemble_docx(parts["num"], parts["date_ru"], parts["customer"], parts["occasion"],
                            parts["rows"], parts["total_line"], parts["notes"], str(tmp))
              data = tmp.read_bytes()
              media_id = None
              keys = [ZN, AGT] if AGT != ZN else [ZN]
              for key in keys:
                  boundary = "----zapnoty" + uuid.uuid4().hex
                  body = (
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="file"; filename="smeta-{sid[:8]}.docx"\r\n'
                      f"Content-Type: {DOCX_MIME}\r\n\r\n"
                  ).encode() + data + f"\r\n--{boundary}--\r\n".encode()
                  st2, raw2 = req("POST", "/v1/agent/media", key, body,
                                  {"Content-Type": "multipart/form-data; boundary=" + boundary})
                  if st2 == 200:
                      media_id = json.loads(raw2).get("id")
                      break
                  print(f"upload fail key={key[:8]}… {st2} {raw2[:200]!r}")
              if not media_id:
                  print(f"{sid}: не удалось загрузить файл — повторим в следующий запуск")
                  continue
              delivered = False
              for target in TARGETS:
                  body = {"subscriber_id": target, "text": msg[:3900], "media": {"type": "document", "media_id": media_id}}
                  st3, raw3 = send_with_approval(body)
                  print(f"send {sid} -> {target[:10]}…: {st3} {raw3[:200]!r}")
                  delivered = delivered or st3 == 200
              if delivered:
                  seen.add(sid)
              else:
                  print(f"{sid}: доставка не подтверждена (ждёт одобрения?) — повторим в следующий запуск")
              tmp.unlink(missing_ok=True)

          state["seen"] = list(seen)[-500:]
          cur.write_text(json.dumps(state))
          print("done, processed:", len(fresh))
          PY
